# =====================================================================
# Configuration de Tontine App
# Aucun secret ici : les valeurs sensibles viennent du fichier .env
# (local) ou des variables d'environnement (déploiement).
# =====================================================================

spring.application.name=tontine-app

# Lit le fichier .env à la racine du projet, s'il existe
spring.config.import=optional:file:.env[.properties]

# --- Connexion à la base MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/tontine_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway (migrations de la base) ---
spring.flyway.enabled=true